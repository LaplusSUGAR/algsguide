name: Collect data and deploy site

on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub may delay scheduled runs; minimum interval is 5 minutes
  push:
    branches: [main]
    paths-ignore: ['site-data/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect official standings (algs.ea.com data)
        run: node scripts/collect.mjs
        continue-on-error: true
      - name: Commit collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data/live.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update standings data"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "push failed; deploying with local data"
          fi
      - name: Build site
        run: |
          npm --prefix source ci || npm --prefix source install
          node source/build.mjs --pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
